<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keilman Gift Exchange</title>
  <script src="giftExchangeData.js"></script>
  <script src="giftExchange.js"></script>
  <script>
        window.onload = (e) => { loadMyGiftData(); };
    </script>
  </head>
  <body>
      <h2>🎄 Keilman Gift Exchange! 🎄</h2>
    <div id="root">
        <div>
            <span>
                <span id="gifterLabel" style="font-weight:bold;">Nobody</span>
                is giving to 
                <span id="gifteeLabel" style="font-weight:bold;">No one</span> this year!
                🎁
            </span>
        </div>
        <div id="gifteeSuggestions">
          <table id="gifteeSuggestionsTable">
            <caption id="gifteeSuggestionsTableCaption"></caption>
          </table>
        </div>
        <div id="mySuggestions">
          <table id="gifterSuggestionsTable">
            <caption>Gift Suggestions</caption>
            <tr id="newSuggestion">
                <td><input id="newSuggestionText" type="text" placeholder="New Suggestion"></td>
                <td>&nbsp;</td>
                <td><button id="addSuggestionButton" type="button" value="Add" onClick="addSuggestion();">+</button></td>
            </tr>
          </table>
        </div>
    </div>
  </body>
</html>
