<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="index.css">
  <title>Keilman Gift Exchange</title>
  <script src="giftExchangeData.js"></script>
  <script src="giftExchange.js"></script>
  <script>
        window.onload = (e) => { loadMyGiftData(); };
    </script>
  </head>
  <body>
      <h2>🎄 Keilman Gift Exchange! 🎄</h2>
    <div id="root">
        <div id="gifterInfo">
            <span>
                <span id="gifterLabel" style="font-weight:bold;">Nobody</span>
                is giving to 
                <span id="gifteeLabel" style="font-weight:bold;">No one</span> this year!
                🎁
            </span>
        </div>
        <div id="gifteeSuggestions">
          <span id="gifteeSuggestionsTableCaption"></span>
          <table id="gifteeSuggestionsTable">
          <tbody></tbody>
          </table>
        </div>
        <hr class="gifter-sep">
        <div id="gifterSuggestions">
          <span>Add suggestions for your gifter below</span>
          <table id="gifterSuggestionsTable">
            <tbody>
                <tr id="newSuggestion">
                    <td><input id="newSuggestionText" type="text" placeholder="New Suggestion" onInput="validateSuggestion();"></td>
                    <td><button id="addSuggestionButton" type="button" class="add-suggestion" title="Add suggestion" value="Add" onClick="addSuggestion();" disabled="true">+</button></td>
                </tr>
            </tbody>
          </table>
          <div id="notifyGifter">
          <span>Click "Notify Gifter" to let them know you have new suggestions!</span>
              <button id="notifyGifterButton" type="button" class="add-suggestion" title="Notify your gifter" value="Notify" onClick="notifyGifter();">Notify Gifter</button>
          </div>
        </div>
    </div>
  </body>
</html>
